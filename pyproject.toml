[project]
name = "contest-generator"
version = "0.1.0"
description = "电赛工程生成器 — 本地网页工具核心"
requires-python = ">=3.13"
dependencies = [
    "pypdf>=6",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "python-multipart>=0.0.20",  # FastAPI 文件上传
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]  # httpx：FastAPI TestClient 依赖

[project.scripts]
contest-generator = "contest_generator.webapp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
