<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清理本地记录</title>
<style>
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #1c1e26; color: #e6e6e6;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #262a36; border: 1px solid #3a3f4f; border-radius: 12px; padding: 28px 34px; max-width: 560px; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  ul { font-size: 12px; color: #9aa3b5; max-height: 200px; overflow: auto; padding-left: 20px; }
  p { font-size: 14px; line-height: 1.7; }
  .ok { color: #58c78a; font-weight: 600; }
  a { color: #5aa9ff; }
</style>
</head>
<body>
<div class="card">
  <h1>正在清理本地记录…</h1>
  <p>清理范围：旧任务自检勾选、旧题面草稿、旧评分核对、旧购买决策记忆（保留主题 / 代码缩放 / API 配置）。</p>
</div>
<script>
(function () {
  var removed = [];
  Object.keys(localStorage).forEach(function (k) {
    if (k === "firstep.draft.v1" || k === "firstep.buy-decisions.v1" ||
        k.indexOf("firstep.checklist.v1.") === 0 || k.indexOf("score-checklist:") === 0) {
      localStorage.removeItem(k);
      removed.push(k);
    }
  });
  var card = document.querySelector(".card");
  card.innerHTML =
    '<h1 class="ok">✅ 清理完成：已移除 ' + removed.length + ' 条旧记录</h1>' +
    (removed.length ? "<ul>" + removed.map(function (k) { return "<li>" + k.split("<").join("&lt;") + "</li>"; }).join("") + "</ul>" : "<p>没有发现旧记录。</p>") +
    "<p>现在可以：<br>① 关闭本页<br>② 回到工具页面按 <b>Ctrl+F5</b> 强刷一次<br>③ 重新生成 2024H —— 全程无旧记录残留。</p>";
})();
</script>
</body>
</html>
