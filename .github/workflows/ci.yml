name: CI

# 为什么要有它（工单 commit-gate/04）：
# 2026-09-15 那次误删让母版同步守卫在 main 上**红了整整一天**没人发现，根因写着
# 「因为没人跑全套」。本地已有 pre-push 钩子，但那只保护**配过 `core.hooksPath` 的机器**
# （别人 clone 不配就没有），也没法在 PR 上给出来。CI 就是那道不依赖本机状态的网。
#
# 两条不变量（本仓库既有约定，别破）：
#   1. **不联网**：测试刻意不打网络（tests/fakes.py 的桩），所以 CI 不吃任何 secret；
#   2. **判据与本地同一套**：跑的就是 `python -m pytest` 与 `tools/preflight.py`，不另写一套。

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同分支连推时取消上一轮，省 runner 也不看陈旧结果
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    # 与用户机同平台：路径长度 / CRLF 字节口径 / .ps1 编码这些真风险只在 Windows 上暴露
    name: 全套 pytest（windows-latest）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 取全历史：CHANGELOG 锚点守卫要查「锚点那个提交在不在本仓库」，
          # 浅克隆（默认 fetch-depth: 1）下连 HEAD~1 都没有，那道守卫会假红
          # 或者被迫跳过——两种都不该发生在最需要它的地方（2026-09-16 CI 实测）。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # pyproject.toml 的 requires-python = ">=3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # 前端门禁用的命令是 `node --test "tests/js/*.test.mjs"`（glob 位置参数
          # 需要 **Node ≥21**；不钉版本时 windows-latest 预装的 node 会变，
          # Node 20 会把 glob 当字面文件名而报 MODULE_NOT_FOUND——那时要么假红
          # 要么静默跑 0 个用例）。钉在 22 这个 LTS 上，判据才可复现。
          node-version: "22"
      - name: 装依赖（声明的那份：运行依赖 + dev 组）
        run: python -m pip install -e ".[dev]"
      - name: 前端门禁（工单 module-hwcheck/01）
        # pytest 面完全看不见 tests/js/（1500+ 条前端用例）——这条与本地
        # pre-push 闸门同一条命令、同一个 glob（判据只有一份），改了导航 / fx /
        # ui 却漏同步守卫时当场红。**放在 windows job**：前端资产是给
        # Windows 用户机用的，且导航守卫读的就是 index.html 这份静态标记
        # （2026-09-12 那次「一打开就卡死」只在这条链上暴露）。
        # 前端用例只 import node:test / node:assert / node:fs（+ 两处 node --check
        # 语法校验），不联网、不吃 secret。
        run: node --test "tests/js/*.test.mjs"
      - name: 全套测试（并行，与本地同一条命令）
        run: python -m pytest -n auto -q

  browser-suite:
    # 浏览器门禁（工单 ui-dom-contract-gate/03）：真浏览器 + 真后端的 21 条验收用例。
    # **为什么不并进上面那个 job**：它要 npm 依赖与 Chromium（下面两步），而上面那支
    # 的前提是"零 npm 依赖也能跑"——混在一起会让 pytest 那一支也背上浏览器前提。
    # 单独一个 job，本地闸门（tools/prepush.py）与这里跑**同一条命令**，判据只有一份。
    name: 浏览器门禁（windows-latest，真 Chromium + 真后端）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 与另两个 job 同口径：本支的夹具自己起后端，但 checkout 浅克隆会让
          # 仓库根的事实守卫（CHANGELOG 锚点等）在需要它们的地方假红，统一取全历史。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # pyproject.toml 的 requires-python = ">=3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"      # playwright 的 engines 与本地口径
          cache: npm
      - name: 装依赖（声明的那份：运行依赖 + dev 组）
        # 夹具起的是**真后端**（python -m contest_generator.webapp），要装运行依赖
        run: python -m pip install -e ".[dev]"
      - name: 装 npm 依赖（playwright）
        run: npm install
      - name: 装 Chromium（playwright 的浏览器二进制）
        run: npx playwright install chromium
      - name: 浏览器门禁（与本地 tools/prepush.py 同一条命令）
        # 夹具自己向内核要空闲端口（不占 8791 / 8000），跑完自己收服务；
        # --test-concurrency=1：每个 spec 各起一个真后端 + 一个真 Chromium，串行才可归因。
        run: node --test --test-concurrency=1 "tests/browser/*.spec.mjs"

  fast-checks:
    # 快速面：不装运行依赖也能跑的机械守卫 + 发版自检
    name: 快速守卫（ubuntu-latest）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 与 windows job 同口径：全历史（发版自检要查 git 索引/锚点）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: 装测试依赖（`dev` 组；快速面只跑 pytest，不装运行依赖）
        run: python -m pip install -e ".[dev]"
      - name: 发版前自检（三处版本号 / 母版编码钉 / 下载文档 / README 版本行）
        run: python tools/preflight.py
      - name: 配置钩子路径（新 clone 没有 core.hooksPath，本机是手动配的）
        run: git config core.hooksPath .githooks
      - name: 中文语言约定与 .ps1 编码约定
        run: python -m pytest -q tests/test_repo_language.py tests/test_ps1_encoding.py
      - name: 闸门自身的用例（选择器 + 钩子契约 + 发版自检 + CI 契约）
        run: python -m pytest -q tests/test_prepush.py tests/test_prepush_hook.py tests/test_preflight.py tests/test_ci_workflow.py
